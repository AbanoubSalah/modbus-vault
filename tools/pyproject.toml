[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modbus_pipeline"
version = "0.1.0"
description = "Parse Blackbox Logger records"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["modbus", "logging"]
dependencies = [
    "paho-mqtt",
    "protobuf",
    "pyserial",
    "esptool",
]
